services:
  jenkins:
    build: .
    image: ccse-jenkins-python:lts
    container_name: ccse-jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    restart: unless-stopped
    mem_limit: 2g
    environment:
      - JAVA_OPTS=-Xmx1024m -Xms256m

  db:
    image: postgres:15
    container_name: ccse-sonar-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - sonar_db:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 512m

  sonarqube:
    image: sonarqube:community
    container_name: ccse-sonarqube
    depends_on:
      - db
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      SONAR_CE_JAVAOPTS: "-Xmx512m -Xms128m"
      SONAR_WEB_JAVAOPTS: "-Xmx512m -Xms128m"
      SONAR_SEARCH_JAVAOPTS: "-Xmx512m -Xms512m -Des.disk.watermark.low=10% -Des.disk.watermark.high=5% -Des.disk.watermark.flood_stage=3%"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    restart: unless-stopped
    mem_limit: 2g

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: ccse-zap
    command: zap.sh -daemon -host 0.0.0.0 -port 8090 -config api.disablekey=true -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true
    ports:
      - "8090:8090"
    restart: unless-stopped
    mem_limit: 1g

volumes:
  jenkins_home:
  sonar_db:
  sonar_data:
  sonar_extensions:
  sonar_logs:
